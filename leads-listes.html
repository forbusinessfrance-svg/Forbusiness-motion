/* =========================================================
   FORBUSINESS — MOTION V14 · DES LEADS. PAS DES LISTES.
   Le poster prend vie : la marque, le titre ligne à ligne,
   puis la carte de notification qui se pose comme un vrai
   lead entrant — avatar, texte, coche. Signature en bas.
   7 s, immobilité de lecture, fondu blanc, boucle.

   Même langage que les films précédents : transform + opacity
   uniquement, easing cubic-bezier(.16,1,.3,1). La carte est
   la seule pièce en perspective — une inclinaison CSS figée,
   fidèle au visuel, jamais animée en 3D.
   ========================================================= */

:root{
  --blue:#2154FF;
  --ink:#101014;
  --grey:#8A8A92;
  --chip:#ECEFF5;

  --e:cubic-bezier(.16,1,.3,1);
  --hero:cubic-bezier(.2,1.06,.32,1);
}

*{box-sizing:border-box;margin:0;padding:0}

html,body{
  width:100%;height:100%;overflow:hidden;background:#0B0B0D;
  font-family:'FBF Text',-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  -webkit-text-size-adjust:100%;
}

body{
  display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;
}

.stage{
  position:relative;
  width:min(100vw,56.25vh);
  width:min(100vw,56.25dvh);
  aspect-ratio:9/16;
  overflow:hidden;
  background:#FFFFFF;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
@supports not (aspect-ratio:9/16){
  .stage{height:min(177.7778vw,100vh);height:min(177.7778vw,100dvh)}
}

.viewport{
  position:absolute;left:0;top:0;width:1080px;height:1920px;
  transform-origin:0 0;
  opacity:1;
  /* Fondu de sortie : la page revient au blanc pur avant de reboucler. */
  transition:opacity .95s cubic-bezier(.45,.05,.25,1);
}
.viewport.out{opacity:0}

.noanim,.noanim *{transition:none !important;animation:none !important}

/* ---- révélations ---- */

.rv{
  opacity:0;transform:translateY(14px);
  transition:opacity .5s linear,transform .85s var(--e);
}
.rv.in{opacity:1;transform:translateY(0)}
.rv-down{transform:translateY(-6px)}

/* =========================================================
   COMPOSITION — le poster 2:3 (1080×1620) centré dans le 9:16,
   150 px d'air en haut et en bas.
   ========================================================= */

/* ---- La marque, seule ---- */

#mark{position:absolute;left:79px;top:274px;width:69px;height:94px}
#mark svg{display:block;width:100%;height:100%}

/* ---- Le titre ---- */

#l1,#l2,#l3{
  position:absolute;left:76px;
  font-family:'FBF Display';font-size:138px;font-weight:800;
  letter-spacing:-.012em;line-height:1;color:var(--ink);white-space:nowrap;
}
#l1{top:538px}
#l2{top:707px}
#l3{top:876px}
#l1 .bl{color:var(--blue)}

#l1.rv,#l2.rv,#l3.rv{filter:blur(5px);transition:opacity .5s linear,transform .85s var(--e),filter .6s var(--e)}
#l1.rv.in,#l2.rv.in,#l3.rv.in{filter:blur(0)}

/* ---- La carte de notification ---- */

/* L'enveloppe porte l'entrée (montée + pose) ; l'inclinaison
   perspective vit sur la carte elle-même et ne bouge jamais. */
#cardw{
  position:absolute;left:201px;top:1071px;width:790px;height:330px;
  opacity:0;transform:translateY(30px) scale(.965);
  transition:opacity .6s linear,transform 1.05s var(--hero);
  will-change:transform,opacity;
}
#cardw.in{opacity:1;transform:translateY(0) scale(1)}

#card,#slab{
  position:absolute;inset:0;
  transform:perspective(1700px) rotateY(-9deg) rotateX(3deg) rotate(-4.6deg);
  border-radius:42px;
}
/* La tranche du volume, un frère placé derrière : un ::before en z-index
   négatif se peindrait AU-DESSUS du fond de la carte (ordre de peinture
   d'un stacking context), et la carte sortirait grise. */
#slab{
  background:#E4E6EC;
  transform:perspective(1700px) rotateY(-9deg) rotateX(3deg) rotate(-4.6deg) translate(-8px,10px);
}
#card{
  background:#FFFFFF;
  border:1px solid #F2F3F7;
  box-shadow:
    0 96px 110px -52px rgba(18,28,72,.20),
    0 48px 90px -38px rgba(33,84,255,.34);
  display:flex;align-items:center;
}

#card .avatar{
  width:112px;height:112px;border-radius:50%;background:var(--blue);
  margin-left:52px;flex:none;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transform:scale(.55);
  transition:opacity .4s linear,transform .75s var(--e);
}
#card.fill .avatar{opacity:1;transform:scale(1)}
#card .avatar svg{width:58px;height:58px;display:block}

#card .txt{margin-left:44px;flex:1;min-width:0}
#card .t1{
  font-size:47px;font-weight:600;line-height:1.17;letter-spacing:-.015em;color:var(--ink);
  opacity:0;transform:translateY(10px);
  transition:opacity .45s linear .08s,transform .7s var(--e) .08s;
}
#card .t2{
  margin-top:16px;
  font-size:30px;font-weight:400;letter-spacing:-.008em;color:var(--grey);
  opacity:0;transform:translateY(10px);
  transition:opacity .45s linear .18s,transform .7s var(--e) .18s;
}
#card.fill .t1,#card.fill .t2{opacity:1;transform:translateY(0)}

#card .chip{
  width:118px;height:118px;border-radius:50%;background:var(--chip);
  margin-right:50px;flex:none;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transform:scale(.55);
  transition:opacity .4s linear,transform .8s var(--hero);
}
#card.check .chip{opacity:1;transform:scale(1)}
#card .chip svg{width:60px;height:60px;display:block}
/* La coche se trace une fois la pastille posée. */
#card .chip path{
  stroke-dasharray:70;stroke-dashoffset:70;
  transition:stroke-dashoffset .5s var(--e) .18s;
}
#card.check .chip path{stroke-dashoffset:0}

/* ---- Signature ---- */

#sig{position:absolute;left:79px;top:1582px}
#sig .bar{
  position:absolute;left:0;top:4px;width:5px;height:74px;background:var(--blue);
  opacity:0;transform:scaleY(0);transform-origin:50% 0;
  transition:opacity .4s linear,transform .65s var(--e);
}
#sig.in .bar{opacity:1;transform:scaleY(1)}
#sig .s1,#sig .s2{
  position:absolute;left:26px;
  font-size:35px;font-weight:500;letter-spacing:-.012em;line-height:1;
  white-space:nowrap;
}
#sig .s1{top:6px;color:var(--ink)}
#sig .s2{top:50px;color:var(--blue)}

@media (prefers-reduced-motion:reduce){
  .rv,.rv *,#cardw,#card *,#sig *{transition:none !important}
}
</style>
</head>
<body>

<div class="stage" id="stage">
<div class="viewport" id="viewport">

  <!-- La marque -->
  <div id="mark" class="rv rv-down">
    <svg viewBox="0 0 70 96" aria-hidden="true">
      <path fill="var(--ink)" d="M6 0 H47.5 A22.5 22.5 0 0 1 47.5 45 H6 Q0 45 0 39 V6 Q0 0 6 0 Z"/>
      <path fill="var(--ink)" d="M6 52 H48 A22 22 0 0 1 48 96 H6 Q0 96 0 90 V58 Q0 52 6 52 Z"/>
    </svg>
  </div>

  <!-- Le titre -->
  <div id="l1" class="rv">DES <span class="bl">LEADS.</span></div>
  <div id="l2" class="rv">PAS DES</div>
  <div id="l3" class="rv">LISTES.</div>

  <!-- La carte -->
  <div id="cardw">
    <div id="slab"></div>
    <div id="card">
      <span class="avatar">
        <svg viewBox="0 0 48 48" fill="#fff" aria-hidden="true">
          <circle cx="24" cy="17" r="8.5"/>
          <path d="M8.5 41a15.5 13 0 0 1 31 0 2.5 2.5 0 0 1-2.5 2.5h-26A2.5 2.5 0 0 1 8.5 41Z"/>
        </svg>
      </span>
      <span class="txt">
        <div class="t1">Nouveau lead<br>qualifié</div>
        <div class="t2">Intéressé par vos services</div>
      </span>
      <span class="chip">
        <svg viewBox="0 0 48 48" fill="none" stroke="var(--blue)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10 25.5 20 35 38 14"/>
        </svg>
      </span>
    </div>
  </div>

  <!-- Signature -->
  <div id="sig">
    <span class="bar"></span>
    <span class="s1 rv">Moins de prospection.</span>
    <span class="s2 rv">Plus de résultats.</span>
  </div>

</div>
</div>

<script>
(function(){
"use strict";

var $ = function(id){ return document.getElementById(id); };

function fit(){
  $("viewport").style.transform = "scale(" + ($("stage").clientWidth / 1080) + ")";
}
window.addEventListener("resize", fit, { passive:true });
window.addEventListener("orientationchange", fit, { passive:true });
if(window.ResizeObserver){ new ResizeObserver(fit).observe($("stage")); }

/* =========================================================
   TIMELINE — marque → titre → la carte se pose → son contenu
   → la coche → signature. Immobilité à 7 s, fondu, boucle.
   ========================================================= */

var TL = [
  [140,  function(){ $("mark").classList.add("in"); }],

  [520,  function(){ $("l1").classList.add("in"); }],
  [770,  function(){ $("l2").classList.add("in"); }],
  [1020, function(){ $("l3").classList.add("in"); }],

  /* la carte se pose comme une notification entrante */
  [1850, function(){ $("cardw").classList.add("in"); }],
  [2350, function(){ $("card").classList.add("fill"); }],
  [2850, function(){ $("card").classList.add("check"); }],

  [3500, function(){ $("sig").classList.add("in"); }],
  [3650, function(){ document.querySelector("#sig .s1").classList.add("in"); }],
  [3800, function(){ document.querySelector("#sig .s2").classList.add("in"); }],

  /* fondu vers le blanc : la boucle repart d'une page vierge */
  [7000, function(){ $("viewport").classList.add("out"); }]
];

var LOOP_AT = 8450;
var timers = [];

function clearAll(){ timers.forEach(clearTimeout); timers = []; }

function reset(){
  clearAll();
  var vp = $("viewport");
  vp.classList.add("noanim");
  vp.classList.remove("out");
  document.querySelectorAll(".in").forEach(function(el){ el.classList.remove("in"); });
  $("card").classList.remove("fill","check");
  void vp.offsetWidth;
  vp.classList.remove("noanim");
}

function run(){
  reset();
  TL.forEach(function(step){
    timers.push(setTimeout(step[1], step[0]));
  });
  timers.push(setTimeout(run, LOOP_AT));
}

/* Vérification hors ligne : ?still=N fige le film à N secondes. */
function seek(seconds){
  clearAll();
  var vp = $("viewport");
  vp.classList.add("noanim");
  vp.classList.remove("out");
  document.querySelectorAll(".in").forEach(function(el){ el.classList.remove("in"); });
  $("card").classList.remove("fill","check");
  var ms = seconds * 1000;
  TL.forEach(function(step){ if(step[0] <= ms) step[1](); });
  void vp.offsetWidth;
}
window.__seek = seek;

document.addEventListener("visibilitychange", function(){
  if(document.hidden) clearAll();
  else if(!still) run();
});

$("stage").addEventListener("pointerdown", function(){ if(!still) run(); });

fit();

var params = new URLSearchParams(location.search);
var still = params.has("still");

function start(){
  if(still){
    seek(Number(params.get("still")) || 0);
    document.body.dataset.ready = "1";
    return;
  }
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches){
    seek(6.5);
    document.body.dataset.ready = "1";
    return;
  }
  run();
  document.body.dataset.ready = "1";
}

if(document.fonts && document.fonts.ready){
  var kicked = false;
  var kick = function(){ if(!kicked){ kicked = true; start(); } };
  document.fonts.ready.then(kick, kick);
  setTimeout(kick, 600);
}else{
  start();
}

})();
</script>

</body>
</html>
