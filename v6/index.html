<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0B0B0D">
<meta name="description" content="ForBusiness V6 — Votre croissance, notre mission.">
<title>ForBusiness — Motion V6</title>

<style>
/* =========================================================
   FORBUSINESS — MOTION V6 · LA FUSÉE
   Reproduction fidèle de l'image de référence, animée.
   ~14 s · 9:16 · boucle propre · décollage final.
   ========================================================= */

:root{
  --blue:#2457FF;
  --black:#0A0A0C;
  --g1:#8A8A92;
  --g2:#C6C6CC;

  --eo:cubic-bezier(.16,1,.3,1);
  --eio:cubic-bezier(.66,0,.14,1);
  --spring:cubic-bezier(.26,1.16,.33,1);
  --cam:cubic-bezier(.3,.65,.15,1);
  --micro:cubic-bezier(.33,.85,.3,1);
  --exit:cubic-bezier(.68,0,.86,.04);
  --launch:cubic-bezier(.6,.02,.85,.4);
}

*{box-sizing:border-box;margin:0;padding:0}

html,body{
  width:100%;height:100%;overflow:hidden;background:#0B0B0D;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;
}

body{
  display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;
}

.stage{
  position:relative;
  width:min(100vw,56.25vh);
  width:min(100vw,56.25dvh);
  aspect-ratio:9/16;
  overflow:hidden;
  background:#fff;
  -webkit-font-smoothing:antialiased;
}

@supports not (aspect-ratio:9/16){
  .stage{height:min(177.7778vw,100vh);height:min(177.7778vw,100dvh)}
}

.viewport{
  position:absolute;left:0;top:0;width:1080px;height:1920px;
  transform-origin:0 0;will-change:transform;
}

.camera{
  position:absolute;inset:0;
  transform-origin:540px 1000px;
  transform:translate3d(0,0,0) scale(1);
  transition:transform 4800ms var(--cam);
  will-change:transform;
}

.noanim,.noanim *,.noanim *::before,.noanim *::after{
  transition:none !important;animation:none !important;
}

/* =========================================================
   RÉVÉLATIONS
   ========================================================= */

.rv{
  opacity:0;transform:translateY(26px);
  transition:opacity .55s linear,transform .9s var(--eo);
}
.rv.in{opacity:1;transform:translateY(0)}
.rv.bye{opacity:0;transform:translateY(-18px);transition:opacity .4s linear,transform .55s var(--exit)}

.w{
  display:inline-block;vertical-align:top;overflow:hidden;
  padding-bottom:.16em;margin-bottom:-.16em;
}
.w > i{
  display:block;font-style:normal;
  transform:translateY(118%);opacity:0;filter:blur(4px);
  transition:transform .9s var(--eo),opacity .4s linear,filter .5s var(--eo);
  transition-delay:calc(var(--i,0) * 70ms);
}
.tl.in > .w > i{transform:translateY(0);opacity:1;filter:blur(0)}
.tl.out > .w > i{
  transform:translateY(-112%);opacity:0;filter:blur(3px);
  transition:transform .5s var(--exit),opacity .28s linear .04s,filter .35s var(--exit);
  transition-delay:calc(var(--i,0) * 26ms);
}

/* =========================================================
   LOGO — ForBusinessfrance.fr.
   ========================================================= */

#logo{
  position:absolute;left:70px;top:110px;
  display:flex;align-items:center;gap:20px;z-index:30;
}

.mk{width:64px;height:64px;position:relative;flex:none}
.mk::before,.mk::after{
  content:"";position:absolute;left:0;width:52px;
  background:var(--black);
}
.mk::before{top:3px;height:26px;border-radius:9px 22px 22px 4px}
.mk::after{bottom:3px;height:28px;border-radius:4px 22px 22px 9px}

#logo .lt{font-size:42px;font-weight:740;letter-spacing:-.035em;color:var(--black)}
#logo .lt b{
  display:inline-block;color:var(--blue);font-weight:740;
  transform:scale(0);transform-origin:50% 74%;
}
#logo .lt b.pop{transform:scale(1);transition:transform .55s var(--spring)}
@keyframes breathe6{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.14)}
}
#logo .lt b.life{animation:breathe6 2.4s ease-in-out .2s infinite}

/* =========================================================
   HEADLINE — centrée, capitale, comme l'image
   ========================================================= */

#h6{position:absolute;left:0;right:0;top:376px;text-align:center;z-index:30}
#h6a,#h6b{
  font-size:78px;line-height:1.16;font-weight:800;letter-spacing:-.02em;
  color:var(--black);white-space:nowrap;
}
#h6b .bl{color:var(--blue)}

/* =========================================================
   LA FUSÉE
   ========================================================= */

#rk{
  position:absolute;inset:0;z-index:20;
}

/* assemblage fusée — légère inclinaison comme sur l'image */
#rkt{
  position:absolute;left:340px;top:590px;width:400px;height:800px;
  opacity:0;
  transform:translateY(130px);
  transition:opacity .8s linear,transform 2.3s var(--eo);
  will-change:transform,opacity;
}
#rk.on #rkt{opacity:1;transform:translateY(0)}

/* décollage : accélération franche vers le haut */
#rk.launch #rkt{
  transform:translateY(-1650px);
  transition:transform 1.25s var(--launch),opacity .3s linear;
}

#rbody{
  position:absolute;inset:0;
  transform:rotate(7deg);
  transform-origin:50% 68%;
}

/* hover : flottement + balancement imperceptibles */
@keyframes hover6{
  0%,100%{transform:rotate(7deg) translateY(0)}
  50%{transform:rotate(6.2deg) translateY(-10px)}
}
#rk.live #rbody{animation:hover6 4.6s ease-in-out infinite}

/* --- corps blanc --- */
.rshell{
  position:absolute;left:105px;top:150px;width:190px;height:440px;
  background:linear-gradient(100deg,#FFFFFF 32%,#F1F2F5 62%,#D9DBE1 92%);
  border-radius:95px 95px 72px 72px / 210px 210px 95px 95px;
}

/* --- nez noir --- */
.rnose{
  position:absolute;left:139px;top:78px;width:122px;height:126px;
  background:linear-gradient(105deg,#2A2A30 22%,#101013 68%);
  border-radius:61px 61px 18px 18px / 112px 112px 15px 15px;
}

/* --- hublot --- */
.rport{
  position:absolute;left:144px;top:236px;width:112px;height:112px;
  border-radius:50%;
  background:linear-gradient(135deg,#F7F8FA 8%,#C7C9D1 55%,#9EA1AB 100%);
}
.rport::after{
  content:"";position:absolute;left:11px;top:11px;right:11px;bottom:11px;
  border-radius:50%;
  background:radial-gradient(circle at 32% 30%,#3A3A42 6%,#17171B 55%);
}

/* --- marque ForBusiness sur le corps --- */
.rmark{position:absolute;left:160px;top:392px;width:64px;height:64px}
.rmark::before,.rmark::after{
  content:"";position:absolute;left:0;width:44px;background:#111114;
}
.rmark::before{top:0;height:26px;border-radius:8px 20px 20px 4px}
.rmark::after{bottom:6px;height:28px;border-radius:4px 20px 20px 8px}
.rdot{
  position:absolute;left:214px;top:436px;width:15px;height:15px;
  border-radius:50%;background:var(--blue);
}
@keyframes rdotb{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.25)}
}
#rk.live .rdot{animation:rdotb 2.2s ease-in-out .4s infinite}

/* --- ailerons --- */
.rfinL{
  position:absolute;left:24px;top:428px;width:114px;height:216px;
  background:linear-gradient(120deg,#242429,#111114);
  border-radius:85% 8% 30% 70% / 70% 12% 55% 45%;
  transform:rotate(-6deg);
}
.rfinR{
  position:absolute;left:262px;top:428px;width:114px;height:216px;
  background:linear-gradient(60deg,#111114,#242429);
  border-radius:8% 85% 70% 30% / 12% 70% 45% 55%;
  transform:rotate(6deg);
}
.rfinC{
  position:absolute;left:189px;top:508px;width:22px;height:116px;
  background:#0D0D10;
  border-radius:11px 11px 8px 8px;
}

/* --- tuyère --- */
.rnoz{
  position:absolute;left:154px;top:582px;width:92px;height:50px;
  background:linear-gradient(#33333A 8%,#101013 70%);
  border-radius:16px 16px 22px 22px;
}
.rnoz::after{
  content:"";position:absolute;left:8px;bottom:2px;right:8px;height:12px;
  border-radius:8px;background:#000;
}

/* --- flammes --- */
.rfl{
  position:absolute;top:624px;width:52px;height:210px;
  background:linear-gradient(to bottom,
    #FFFBEF 0%,#FFEFC8 26%,#FFD99B 55%,rgba(255,214,150,.25) 82%,rgba(255,214,150,0) 100%);
  border-radius:50% 50% 50% 50% / 26% 26% 74% 74%;
  opacity:0;
  transform-origin:50% 0;
  transition:opacity .45s linear;
}
.rf1{left:142px;transform:rotate(5deg)}
.rf2{left:210px;height:184px;transform:rotate(-5deg)}
#rk.on .rfl{opacity:.96}

@keyframes flick1{
  0%,100%{transform:rotate(5deg) scaleY(1)}
  50%{transform:rotate(5.5deg) scaleY(1.12)}
}
@keyframes flick2{
  0%,100%{transform:rotate(-5deg) scaleY(1)}
  50%{transform:rotate(-5.6deg) scaleY(.9)}
}
#rk.live .rf1{animation:flick1 .34s ease-in-out infinite}
#rk.live .rf2{animation:flick2 .27s ease-in-out .1s infinite}

/* décollage : les flammes s'allongent */
#rk.launch .rf1{animation:none;transform:rotate(5deg) scaleY(1.55)}
#rk.launch .rf2{animation:none;transform:rotate(-5deg) scaleY(1.55)}

/* --- lueur chaude au sol --- */
#glw{
  position:absolute;left:290px;top:1240px;width:500px;height:360px;
  background:radial-gradient(ellipse at center,
    rgba(255,232,190,.85) 0%,rgba(255,224,170,.35) 45%,rgba(255,224,170,0) 72%);
  opacity:0;
  transition:opacity .9s linear;
}
#rk.on #glw{opacity:1}
@keyframes glowp{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.72;transform:scale(1.06)}
}
#rk.live #glw{animation:glowp 1.1s ease-in-out infinite}
#rk.launch #glw{opacity:0;transition:opacity .6s linear .15s}

/* --- fumée --- */
#smk{position:absolute;inset:0}

.pf{
  position:absolute;
  border-radius:50%;
  background:radial-gradient(circle at 36% 32%,#FFFFFF 18%,#F4F5F7 58%,#E7E9ED 100%);
  box-shadow:0 10px 26px rgba(10,10,25,.04);
  opacity:0;
  transform:scale(.25) translateY(40px);
  transition:opacity .7s linear var(--d,0s),transform 1.4s var(--eo) var(--d,0s);
}
#rk.on .pf{opacity:1;transform:scale(1) translateY(0)}

/* bouillonnement lent, phases différentes */
@keyframes boil{
  0%,100%{transform:scale(1) translateY(0)}
  50%{transform:scale(1.055) translateY(-7px)}
}
#rk.live .pf{animation:boil calc(3.2s + var(--b,0s)) ease-in-out calc(var(--d,0s) * 2) infinite}

/* le nuage se dissipe après le départ */
#rk.launch .pf{
  opacity:0;transform:scale(1.18) translateY(-26px);
  transition:opacity .9s linear .1s,transform 1.1s var(--eio);
}

/* =========================================================
   FIN — ForBusiness.
   ========================================================= */

#fin{position:absolute;inset:0;z-index:40;pointer-events:none}

#fb{
  position:absolute;left:0;right:0;top:780px;
  display:flex;align-items:center;justify-content:center;gap:26px;
}
#fb .mk{width:96px;height:96px}
#fb .mk::before,#fb .mk::after{width:78px}
#fb .mk::before{top:5px;height:39px;border-radius:13px 34px 34px 5px}
#fb .mk::after{bottom:5px;height:41px;border-radius:5px 34px 34px 13px}
#fb .fbt{font-size:92px;font-weight:760;letter-spacing:-.04em;color:var(--black)}
#fb .fbt b{
  display:inline-block;position:relative;
  color:var(--blue);font-weight:760;
  transform:scale(0);
  transform-origin:50% 74%;
}

@keyframes dotin{
  0%{transform:translateY(-120px) scale(.5);opacity:0}
  30%{opacity:1}
  55%{transform:translateY(0) scale(1.3)}
  72%{transform:translateY(0) scale(.9)}
  100%{transform:translateY(0) scale(1)}
}
#fb .fbt b.pop{animation:dotin .75s cubic-bezier(.3,.7,.3,1) forwards}

@keyframes beat{
  0%,100%{transform:scale(1)}
  18%{transform:scale(1.42)}
  40%{transform:scale(1)}
}
#fb .fbt b.beat{animation:beat 1.15s cubic-bezier(.3,.6,.3,1) infinite}

#fb .fbt b.beat::after{
  content:"";position:absolute;left:50%;top:74%;
  width:34px;height:34px;margin:-17px 0 0 -17px;
  border:4px solid var(--blue);border-radius:50%;
  opacity:0;
  animation:ping 1.15s cubic-bezier(.2,.55,.35,1) infinite;
}
@keyframes ping{
  0%{transform:scale(.45);opacity:.75}
  75%,100%{transform:scale(2.6);opacity:0}
}

#tg6{
  position:absolute;left:0;right:0;top:950px;text-align:center;
  font-size:34px;font-weight:540;letter-spacing:-.02em;color:var(--g1);
}

#cta6{
  position:absolute;left:250px;top:1072px;width:580px;height:104px;border-radius:999px;
  background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;gap:16px;
  font-size:33px;font-weight:700;letter-spacing:-.02em;
}
#cta6 .arr{display:inline-block;transition:transform .5s var(--spring)}
#cta6.go .arr{transform:translateX(9px)}
#cta6.rv.in{box-shadow:0 20px 50px rgba(36,87,255,.26)}

</style>
</head>

<body>

<div class="stage" id="stage">
<div class="viewport" id="viewport">
<div class="camera" id="camera">

  <!-- LOGO -->
  <div id="logo" class="rv">
    <div class="mk"></div>
    <div class="lt">ForBusinessfrance.fr<b id="ldot">.</b></div>
  </div>

  <!-- HEADLINE -->
  <div id="h6">
    <div class="tl" id="h6a"
      ><span class="w" style="--i:0"><i>VOTRE</i></span>
      <span class="w" style="--i:1"><i>CROISSANCE,</i></span></div>
    <div class="tl" id="h6b"
      ><span class="w" style="--i:1"><i>NOTRE</i></span>
      <span class="w" style="--i:2"><i><span class="bl">MISSION</span>.</i></span></div>
  </div>

  <!-- LA FUSÉE -->
  <div id="rk">

    <div id="glw"></div>

    <div id="smk">
      <div class="pf" style="left:118px;top:1400px;width:250px;height:250px;--d:.05s;--b:.3s"></div>
      <div class="pf" style="left:300px;top:1330px;width:300px;height:300px;--d:.14s;--b:.6s"></div>
      <div class="pf" style="left:520px;top:1310px;width:330px;height:330px;--d:0s;--b:0s"></div>
      <div class="pf" style="left:740px;top:1380px;width:260px;height:260px;--d:.2s;--b:.45s"></div>
      <div class="pf" style="left:60px;top:1520px;width:200px;height:200px;--d:.26s;--b:.2s"></div>
      <div class="pf" style="left:850px;top:1500px;width:190px;height:190px;--d:.3s;--b:.7s"></div>
      <div class="pf" style="left:215px;top:1480px;width:270px;height:270px;--d:.1s;--b:.5s"></div>
      <div class="pf" style="left:620px;top:1470px;width:280px;height:280px;--d:.06s;--b:.15s"></div>
      <div class="pf" style="left:420px;top:1440px;width:310px;height:310px;--d:.03s;--b:.35s"></div>
      <div class="pf" style="left:10px;top:1620px;width:170px;height:170px;--d:.36s;--b:.1s"></div>
      <div class="pf" style="left:900px;top:1630px;width:160px;height:160px;--d:.4s;--b:.55s"></div>
    </div>

    <div id="rkt">
      <div id="rbody">
        <div class="rfl rf1"></div>
        <div class="rfl rf2"></div>
        <div class="rfinL"></div>
        <div class="rfinR"></div>
        <div class="rnoz"></div>
        <div class="rshell"></div>
        <div class="rfinC"></div>
        <div class="rnose"></div>
        <div class="rport"></div>
        <div class="rmark"></div>
        <div class="rdot"></div>
      </div>
    </div>

  </div>

  <!-- FIN -->
  <div id="fin">
    <div id="fb" class="rv">
      <div class="mk"></div>
      <div class="fbt">ForBusiness<b id="fdot6">.</b></div>
    </div>
    <div id="tg6" class="rv">Des sites qui font la différence.</div>
    <div id="cta6" class="rv">ForBusinessFrance.fr<span class="arr">→</span></div>
  </div>

</div>
</div>
</div>

<script>
(function(){
"use strict";

var $ = function(id){ return document.getElementById(id); };

function fit(){
  $("viewport").style.transform = "scale(" + ($("stage").clientWidth / 1080) + ")";
}
window.addEventListener("resize", fit, { passive:true });
window.addEventListener("orientationchange", fit, { passive:true });
if(window.ResizeObserver){ new ResizeObserver(fit).observe($("stage")); }

var timers = [];
function at(t, fn){ timers.push(setTimeout(fn, t)); }
function clearAll(){ timers.forEach(clearTimeout); timers = []; }

function cam(scale, y, dur){
  var c = $("camera");
  c.style.transitionDuration = (dur || 4800) + "ms";
  c.style.transform = "translate3d(0," + y + "px,0) scale(" + scale + ")";
}

function reset(){
  clearAll();
  var vp = $("viewport");
  vp.classList.add("noanim");

  $("logo").className = "rv";
  $("ldot").className = "";
  $("h6a").className = "tl";
  $("h6b").className = "tl";

  $("rk").className = "";

  $("fb").className = "rv";
  $("fdot6").className = "";
  $("tg6").className = "rv";
  $("cta6").className = "rv";

  $("camera").style.transitionDuration = "";
  $("camera").style.transform = "translate3d(0,0,0) scale(1)";

  void vp.offsetWidth;
  vp.classList.remove("noanim");
}

/* =========================================================
   TIMELINE — ~14.5 s
   0–2 : logo · 2–5 : headline + la fusée s'installe ·
   5–8.5 : elle vit (flammes, fumée, lueur) ·
   8.5–10 : zoom + DÉCOLLAGE · 10–14.5 : ForBusiness
   ========================================================= */
function run(){

  reset();

  /* ---- 0–2 s · logo + push-in très doux ---- */

  at(200, function(){ $("logo").classList.add("in"); });
  at(800, function(){ $("ldot").classList.add("pop"); });
  at(1550, function(){ $("ldot").classList.add("life"); });

  at(400, function(){ cam(1.025, -16, 5200); });

  /* ---- 2–5 s · headline + la fusée émerge de la fumée ---- */

  at(1950, function(){ $("h6a").classList.add("in"); });
  at(2260, function(){ $("h6b").classList.add("in"); });

  at(2750, function(){ $("rk").classList.add("on"); });

  /* ---- 5–8.5 s · la scène vit ---- */

  at(4600, function(){ $("rk").classList.add("live"); });
  at(5300, function(){ cam(1.04, -34, 3000); });

  /* ---- 8.5–10 s · zoom puis DÉCOLLAGE ---- */

  at(8300, function(){ cam(1.1, -80, 1300); });

  at(9350, function(){
    $("rk").classList.add("launch");
    cam(1.04, -30, 1500);
  });

  /* ---- 10–14.5 s · tout se calme, ForBusiness ---- */

  at(10150, function(){
    $("h6a").classList.remove("in"); $("h6a").classList.add("out");
  });
  at(10230, function(){
    $("h6b").classList.remove("in"); $("h6b").classList.add("out");
  });
  at(10300, function(){
    $("logo").classList.add("bye");
    cam(1, 0, 1100);
  });

  at(11000, function(){ $("fb").classList.add("in"); });
  at(11450, function(){ $("fdot6").classList.add("pop"); });
  at(11550, function(){ $("tg6").classList.add("in"); });
  at(11900, function(){ $("cta6").classList.add("in"); });
  at(12250, function(){
    $("fdot6").classList.remove("pop");
    $("fdot6").classList.add("beat");
  });
  at(12350, function(){ $("cta6").classList.add("go"); });

  /* ---- boucle ---- */

  at(14100, function(){
    $("fb").classList.add("bye");
    $("tg6").classList.add("bye");
    $("cta6").classList.add("bye");
  });

  at(14750, run);
}

document.addEventListener("visibilitychange", function(){
  if(document.hidden) clearAll();
  else run();
});

fit();

var started = false;
function start(){
  if(started) return;
  started = true;
  run();
}

if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(start, start);
  setTimeout(start, 400);
}else{
  start();
}

})();
</script>

</body>
</html>
