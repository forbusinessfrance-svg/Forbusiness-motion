<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0B0B0D">
<meta name="description" content="ForBusiness V6 — Votre croissance, notre mission.">
<title>ForBusiness — Motion V6</title>

<style>
/* =========================================================
   FORBUSINESS — MOTION V6 · LA FUSÉE (SVG vectoriel)
   Rendu net à toute résolution · transform/opacity only.
   ~12.3 s · 9:16 · boucle propre · décollage.
   ========================================================= */

:root{
  --blue:#2457FF;
  --black:#0A0A0C;
  --g1:#8A8A92;

  --eo:cubic-bezier(.16,1,.3,1);
  --eio:cubic-bezier(.66,0,.14,1);
  --spring:cubic-bezier(.26,1.16,.33,1);
  --cam:cubic-bezier(.3,.65,.15,1);
  --exit:cubic-bezier(.68,0,.86,.04);
  --launch:cubic-bezier(.6,.02,.85,.4);
}

*{box-sizing:border-box;margin:0;padding:0}

html,body{
  width:100%;height:100%;overflow:hidden;background:#0B0B0D;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;
}

body{
  display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;
}

.stage{
  position:relative;
  width:min(100vw,56.25vh);
  width:min(100vw,56.25dvh);
  aspect-ratio:9/16;
  overflow:hidden;
  background:#fff;
  -webkit-font-smoothing:antialiased;
}

@supports not (aspect-ratio:9/16){
  .stage{height:min(177.7778vw,100vh);height:min(177.7778vw,100dvh)}
}

.viewport{
  position:absolute;left:0;top:0;width:1080px;height:1920px;
  transform-origin:0 0;will-change:transform;
}

.camera{
  position:absolute;inset:0;
  transform-origin:540px 1000px;
  transform:translate3d(0,0,0) scale(1);
  transition:transform 4800ms var(--cam);
  will-change:transform;
}

.noanim,.noanim *,.noanim *::before,.noanim *::after{
  transition:none !important;animation:none !important;
}

/* =========================================================
   RÉVÉLATIONS
   ========================================================= */

.rv{
  opacity:0;transform:translateY(26px);
  transition:opacity .5s linear,transform .85s var(--eo);
}
.rv.in{opacity:1;transform:translateY(0)}
.rv.bye{opacity:0;transform:translateY(-18px);transition:opacity .4s linear,transform .55s var(--exit)}

.w{
  display:inline-block;vertical-align:top;overflow:hidden;
  padding-bottom:.16em;margin-bottom:-.16em;
}
.w > i{
  display:block;font-style:normal;
  transform:translateY(118%);opacity:0;filter:blur(4px);
  transition:transform .85s var(--eo),opacity .38s linear,filter .48s var(--eo);
  transition-delay:calc(var(--i,0) * 55ms);
}
.tl.in > .w > i{transform:translateY(0);opacity:1;filter:blur(0)}
.tl.out > .w > i{
  transform:translateY(-112%);opacity:0;filter:blur(3px);
  transition:transform .5s var(--exit),opacity .28s linear .04s,filter .35s var(--exit);
  transition-delay:calc(var(--i,0) * 24ms);
}

/* =========================================================
   LOGO
   ========================================================= */

#logo{
  position:absolute;left:70px;top:110px;
  display:flex;align-items:center;gap:20px;z-index:30;
}

.mk{width:64px;height:64px;position:relative;flex:none}
.mk::before,.mk::after{
  content:"";position:absolute;left:0;width:52px;
  background:var(--black);
}
.mk::before{top:3px;height:26px;border-radius:9px 22px 22px 4px}
.mk::after{bottom:3px;height:28px;border-radius:4px 22px 22px 9px}

#logo .lt{font-size:42px;font-weight:740;letter-spacing:-.035em;color:var(--black)}
#logo .lt b{
  display:inline-block;color:var(--blue);font-weight:740;
  transform:scale(0);transform-origin:50% 74%;
}
#logo .lt b.pop{transform:scale(1);transition:transform .55s var(--spring)}
@keyframes breathe6{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.14)}
}
#logo .lt b.life{animation:breathe6 2.4s ease-in-out .2s infinite}

/* =========================================================
   HEADLINE
   ========================================================= */

#h6{position:absolute;left:0;right:0;top:368px;text-align:center;z-index:30}
#h6a,#h6b{
  font-size:78px;line-height:1.16;font-weight:800;letter-spacing:-.02em;
  color:var(--black);white-space:nowrap;
}
#h6b .bl{color:var(--blue)}

/* =========================================================
   LA SCÈNE FUSÉE
   ========================================================= */

#rk{position:absolute;inset:0;z-index:20}

/* lueur chaude au sol */
#glw{
  position:absolute;left:250px;top:1200px;width:580px;height:420px;
  background:radial-gradient(ellipse at center,
    rgba(255,228,178,.9) 0%,rgba(255,220,160,.38) 45%,rgba(255,220,160,0) 72%);
  opacity:0;
  transition:opacity .8s linear .3s;
}
#rk.on #glw{opacity:1}
@keyframes glowp{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.7;transform:scale(1.05)}
}
#rk.live #glw{animation:glowp 1s ease-in-out infinite}
#rk.launch #glw{opacity:0;transition:opacity .55s linear .1s}

/* nuage principal (SVG flou, réaliste) */
#cloud{
  position:absolute;left:-40px;top:1150px;width:1160px;height:720px;
  opacity:0;transform:translateY(70px) scale(.9);
  transform-origin:50% 80%;
  transition:opacity .75s linear .1s,transform 1.3s var(--eo) .1s;
  will-change:transform,opacity;
}
#rk.on #cloud{opacity:1;transform:translateY(0) scale(1)}
@keyframes cboil{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.022)}
}
#rk.live #cloud{animation:cboil 4.4s ease-in-out infinite}
#rk.launch #cloud{
  opacity:0;transform:translateY(-20px) scale(1.1);
  transition:opacity .85s linear .15s,transform 1.05s var(--eio);
}

/* volutes de premier plan (parallaxe du bouillonnement) */
.puff{
  position:absolute;
  opacity:0;transform:translateY(46px) scale(.7);
  transition:opacity .6s linear,transform 1.1s var(--eo);
  will-change:transform;
}
#rk.on .puff{opacity:1;transform:translateY(0) scale(1)}
#pfA{left:150px;top:1360px;width:340px;height:250px;transition-delay:.22s,.22s}
#pfB{left:600px;top:1390px;width:330px;height:240px;transition-delay:.3s,.3s}
@keyframes pboil1{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-9px) scale(1.05)}
}
@keyframes pboil2{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-7px) scale(1.04)}
}
#rk.live #pfA{animation:pboil1 3.4s ease-in-out .2s infinite}
#rk.live #pfB{animation:pboil2 3.9s ease-in-out .8s infinite}
#rk.launch .puff{
  opacity:0;transform:translateY(-16px) scale(1.14);
  transition:opacity .8s linear .1s,transform 1s var(--eio);
}

/* occlusion douce sous la fusée */
#ao{
  position:absolute;left:360px;top:1290px;width:360px;height:130px;
  background:radial-gradient(ellipse at center,rgba(20,22,32,.16) 0%,rgba(20,22,32,0) 68%);
  opacity:0;transition:opacity .8s linear .35s;
}
#rk.on #ao{opacity:1}
#rk.launch #ao{opacity:0;transition:opacity .4s linear}

/* --- la fusée (SVG) + ses flammes --- */
#rwrap{
  position:absolute;left:322px;top:560px;width:436px;height:900px;
  opacity:0;transform:translateY(120px);
  transition:opacity .7s linear,transform 1.7s var(--eo);
  will-change:transform,opacity;
}
#rk.on #rwrap{opacity:1;transform:translateY(0)}
#rk.launch #rwrap{
  transform:translateY(-1750px);
  transition:transform 1.2s var(--launch);
}

#rot{
  position:absolute;inset:0;
  transform:rotate(6deg);
  transform-origin:50% 62%;
}
@keyframes hover6{
  0%,100%{transform:rotate(6deg) translateY(0)}
  50%{transform:rotate(5.3deg) translateY(-9px)}
}
#rk.live #rot{animation:hover6 4.2s ease-in-out infinite}

#rsvg{position:absolute;left:18px;top:0;width:400px;height:820px}
#rsvg svg{display:block;width:100%;height:100%}

/* flammes : SVG, flicker en scaleY */
.fl{
  position:absolute;top:690px;width:84px;height:250px;
  opacity:0;transform-origin:50% 4%;
  transition:opacity .4s linear .5s;
}
#rk.on .fl{opacity:.97}
#flA{left:132px;transform:rotate(4.5deg)}
#flB{left:216px;height:224px;transform:rotate(-4.5deg)}
.fl svg{display:block;width:100%;height:100%}

@keyframes flick1{
  0%,100%{transform:rotate(4.5deg) scaleY(1) scaleX(1)}
  50%{transform:rotate(5deg) scaleY(1.14) scaleX(.94)}
}
@keyframes flick2{
  0%,100%{transform:rotate(-4.5deg) scaleY(.92) scaleX(1)}
  50%{transform:rotate(-5.1deg) scaleY(1.08) scaleX(.95)}
}
#rk.live #flA{animation:flick1 .3s ease-in-out infinite}
#rk.live #flB{animation:flick2 .24s ease-in-out .08s infinite}

#rk.launch #flA{animation:none;transform:rotate(4.5deg) scaleY(1.6)}
#rk.launch #flB{animation:none;transform:rotate(-4.5deg) scaleY(1.6)}

/* point bleu du fuselage : respiration */
.svgdot{transform-box:fill-box;transform-origin:center}
@keyframes rdotb{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.3)}
}
#rk.live .svgdot{animation:rdotb 2s ease-in-out .4s infinite}

/* =========================================================
   FIN — ForBusiness. (inchangée)
   ========================================================= */

#fin{position:absolute;inset:0;z-index:40;pointer-events:none}

#fb{
  position:absolute;left:0;right:0;top:780px;
  display:flex;align-items:center;justify-content:center;gap:26px;
}
#fb .mk{width:96px;height:96px}
#fb .mk::before,#fb .mk::after{width:78px}
#fb .mk::before{top:5px;height:39px;border-radius:13px 34px 34px 5px}
#fb .mk::after{bottom:5px;height:41px;border-radius:5px 34px 34px 13px}
#fb .fbt{font-size:92px;font-weight:760;letter-spacing:-.04em;color:var(--black)}
#fb .fbt b{
  display:inline-block;position:relative;
  color:var(--blue);font-weight:760;
  transform:scale(0);
  transform-origin:50% 74%;
}

@keyframes dotin{
  0%{transform:translateY(-120px) scale(.5);opacity:0}
  30%{opacity:1}
  55%{transform:translateY(0) scale(1.3)}
  72%{transform:translateY(0) scale(.9)}
  100%{transform:translateY(0) scale(1)}
}
#fb .fbt b.pop{animation:dotin .75s cubic-bezier(.3,.7,.3,1) forwards}

@keyframes beat{
  0%,100%{transform:scale(1)}
  18%{transform:scale(1.42)}
  40%{transform:scale(1)}
}
#fb .fbt b.beat{animation:beat 1.15s cubic-bezier(.3,.6,.3,1) infinite}

#fb .fbt b.beat::after{
  content:"";position:absolute;left:50%;top:74%;
  width:34px;height:34px;margin:-17px 0 0 -17px;
  border:4px solid var(--blue);border-radius:50%;
  opacity:0;
  animation:ping 1.15s cubic-bezier(.2,.55,.35,1) infinite;
}
@keyframes ping{
  0%{transform:scale(.45);opacity:.75}
  75%,100%{transform:scale(2.6);opacity:0}
}

#tg6{
  position:absolute;left:0;right:0;top:950px;text-align:center;
  font-size:34px;font-weight:540;letter-spacing:-.02em;color:var(--g1);
}

#cta6{
  position:absolute;left:250px;top:1072px;width:580px;height:104px;border-radius:999px;
  background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;gap:16px;
  font-size:33px;font-weight:700;letter-spacing:-.02em;
}
#cta6 .arr{display:inline-block;transition:transform .5s var(--spring)}
#cta6.go .arr{transform:translateX(9px)}
#cta6.rv.in{box-shadow:0 20px 50px rgba(36,87,255,.26)}

</style>
</head>

<body>

<div class="stage" id="stage">
<div class="viewport" id="viewport">
<div class="camera" id="camera">

  <!-- LOGO -->
  <div id="logo" class="rv">

  <!-- HEADLINE -->
  <div id="h6">

  <!-- LA SCÈNE FUSÉE -->

    <!-- nuage principal : SVG adouci, volumes réalistes -->

          <svg viewBox="0 0 400 820" aria-hidden="true">
            <defs>
              <linearGradient id="bodyg" x1="0" y1="0" x2="1" y2="0">

<script>
(function(){
"use strict";

var $ = function(id){ return document.getElementById(id); };

function fit(){
  $("viewport").style.transform = "scale(" + ($("stage").clientWidth / 1080) + ")";
}
window.addEventListener("resize", fit, { passive:true });
window.addEventListener("orientationchange", fit, { passive:true });
if(window.ResizeObserver){ new ResizeObserver(fit).observe($("stage")); }

var timers = [];
function at(t, fn){ timers.push(setTimeout(fn, t)); }
function clearAll(){ timers.forEach(clearTimeout); timers = []; }

function cam(scale, y, dur){
  var c = $("camera");
  c.style.transitionDuration = (dur || 4800) + "ms";
  c.style.transform = "translate3d(0," + y + "px,0) scale(" + scale + ")";
}

function reset(){
  clearAll();
  var vp = $("viewport");
  vp.classList.add("noanim");

  $("logo").className = "rv";
  $("ldot").className = "";
  $("h6a").className = "tl";
  $("h6b").className = "tl";

  $("rk").className = "";

  $("fb").className = "rv";
  $("fdot6").className = "";
  $("tg6").className = "rv";
  $("cta6").className = "rv";

  $("camera").style.transitionDuration = "";
  $("camera").style.transform = "translate3d(0,0,0) scale(1)";

  void vp.offsetWidth;
  vp.classList.remove("noanim");
}

/* =========================================================
   TIMELINE — ~12.3 s (attente réduite)
   0–1.6 : tout arrive ensemble · 1.6–5.8 : la scène vit ·
   5.8–7.4 : zoom + DÉCOLLAGE · 7.4–12.3 : ForBusiness
   ========================================================= */
function run(){

  reset();

  /* ---- 0–1.6 s · entrée resserrée ---- */

  at(150, function(){ $("logo").classList.add("in"); });
  at(600, function(){ $("ldot").classList.add("pop"); });
  at(1300, function(){ $("ldot").classList.add("life"); });

  at(280, function(){ $("h6a").classList.add("in"); });
  at(500, function(){ $("h6b").classList.add("in"); });

  at(700, function(){ $("rk").classList.add("on"); });
  at(900, function(){ cam(1.045, -32, 4600); });

  /* ---- 1.6–5.8 s · la scène vit ---- */

  at(1650, function(){ $("rk").classList.add("live"); });

  /* ---- 5.8–7.4 s · zoom puis DÉCOLLAGE ---- */

  at(5800, function(){ cam(1.095, -74, 1000); });

  at(6600, function(){
    $("rk").classList.add("launch");
    cam(1.03, -22, 1400);
  });

  /* ---- 7.4–12.3 s · ForBusiness (fin conservée) ---- */

  at(7250, function(){
    $("h6a").classList.remove("in"); $("h6a").classList.add("out");
  });
  at(7330, function(){
    $("h6b").classList.remove("in"); $("h6b").classList.add("out");
  });
  at(7400, function(){
    $("logo").classList.add("bye");
    cam(1, 0, 1000);
  });

  at(7950, function(){ $("fb").classList.add("in"); });
  at(8400, function(){ $("fdot6").classList.add("pop"); });
  at(8500, function(){ $("tg6").classList.add("in"); });
  at(8850, function(){ $("cta6").classList.add("in"); });
  at(9200, function(){
    $("fdot6").classList.remove("pop");
    $("fdot6").classList.add("beat");
  });
  at(9300, function(){ $("cta6").classList.add("go"); });

  /* ---- boucle ---- */

  at(11650, function(){
    $("fb").classList.add("bye");
    $("tg6").classList.add("bye");
    $("cta6").classList.add("bye");
  });

  at(12300, run);
}

document.addEventListener("visibilitychange", function(){
  if(document.hidden) clearAll();
  else run();
});

fit();

var started = false;
function start(){
  if(started) return;
  started = true;
  run();
}

if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(start, start);
  setTimeout(start, 400);
}else{
  start();
}

})();
</script>
