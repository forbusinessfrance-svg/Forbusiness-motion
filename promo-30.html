<title>ForBusiness Motion V12</title>

/* =========================================================
   FORBUSINESS — MOTION V12 · –30 %
   Le poster promo prend vie. Aucun redesign : chaque élément
   apparaît à sa place définitive, puis tout s'immobilise sur
   la frame de référence. 7 s d'animation, tenue longue, boucle.

   Contraintes du brief, prises au pied de la lettre :
   transform + opacity seulement, pas de 3D, pas de dégradé,
   pas de glow, pas de rotation, pas de caméra. Le luxe est
   dans les courbes, pas dans les effets.
   ========================================================= */

:root{
  --blue:#2154FF;
  --ink:#111114;
  --body:#1E1E23;
  --line:#E3E3E8;

  /* La courbe demandée par le brief — tout le film respire dessus. */
  --e:cubic-bezier(.16,1,.3,1);
  /* Variante à micro-overshoot pour le héros. Pas un bounce :
     elle dépasse d'à peine 1 % avant de se poser. */
  --hero:cubic-bezier(.2,1.06,.32,1);
}

  text-rendering:optimizeLegibility;
}
@supports not (aspect-ratio:9/16){
  .stage{height:min(177.7778vw,100vh);height:min(177.7778vw,100dvh)}
}

/* Espace de composition fixe 1080×1920, mis à l'échelle d'un bloc.
   Aucune reflow possible pendant l'animation : zéro layout shift. */
.viewport{
  position:absolute;left:0;top:0;width:1080px;height:1920px;
  transform-origin:0 0;
}

.noanim,.noanim *{transition:none !important;animation:none !important}

/* =========================================================
   RÉVÉLATIONS — un seul vocabulaire, décliné
   ========================================================= */

/* Fondu + petite montée. La distance est courte exprès :
   on doit sentir l'arrivée, pas le trajet. */
.rv{
  opacity:0;transform:translateY(14px);
  transition:opacity .5s linear,transform .85s var(--e);
}
.rv.in{opacity:1;transform:translateY(0)}

/* Le logo descend de 6 px — la seule entrée par le haut (brief). */
.rv-down{transform:translateY(-6px)}

/* =========================================================
   COMPOSITION — mesures prises sur la référence.
   Le bloc reproduit le poster 2:3 (1080×1620), centré dans le
   9:16 avec 150 px d'air en haut et en bas : chaque espacement
   interne est celui de l'image d'origine.
   ========================================================= */

/* ---- Logo ---- */

#mark{position:absolute;left:50%;top:272px;width:70px;height:96px;margin-left:-35px}
#mark svg{display:block;width:100%;height:100%}

#brand{
  position:absolute;left:0;right:0;top:392px;
  display:flex;align-items:center;justify-content:center;gap:12px;
  font-size:37px;font-weight:600;letter-spacing:-.012em;color:var(--ink);
  white-space:nowrap;
}
#brand .bdot{color:var(--blue);font-weight:600}
#brand .badge{width:34px;height:34px;flex:none;margin-top:3px}
#brand .badge svg{display:block;width:100%;height:100%}

/* ---- OFFRE FIN DE SAISON ---- */

#offer{
  position:absolute;left:0;right:0;top:571px;
  display:flex;align-items:center;justify-content:center;gap:16px;
  color:var(--blue);font-size:27px;font-weight:600;letter-spacing:.06em;
  white-space:nowrap;
}
#offer .dot{width:15px;height:15px;border-radius:50%;background:var(--blue);flex:none}

/* ---- Le héros : –30 % ---- */

#hero{
  position:absolute;left:0;right:0;top:588px;height:420px;
  display:flex;align-items:baseline;justify-content:center;
  color:var(--blue);line-height:1;white-space:nowrap;
}
#m30{
  font-size:375px;font-weight:700;letter-spacing:-.065em;
  opacity:0;transform:translateY(12px) scale(.96);
  transform-origin:50% 78%;
  transition:opacity .55s linear,transform 1.05s var(--hero);
  will-change:transform,opacity;
}
#pct{
  font-size:208px;font-weight:700;margin-left:16px;
  position:relative;bottom:10px;
  opacity:0;transform:translateY(12px) scale(.96);
  transform-origin:50% 85%;
  transition:opacity .55s linear .12s,transform 1.05s var(--hero) .12s;
  will-change:transform,opacity;
}
#hero.in #m30,#hero.in #pct{opacity:1;transform:translateY(0) scale(1)}

/* ---- Titre ---- */

#h1,#h2{
  position:absolute;left:0;right:0;text-align:center;
  font-size:86px;font-weight:600;letter-spacing:-.028em;line-height:1;
  color:var(--ink);white-space:nowrap;
}
#h1{top:989px}
#h2{top:1089px}
#h2 .bl{color:var(--blue)}

/* Voile de netteté : autorisé par le brief (« léger motion blur »),
   réservé aux deux lignes du titre, et terminé net. */
#h1.rv,#h2.rv{filter:blur(5px);transition:opacity .5s linear,transform .85s var(--e),filter .6s var(--e)}
#h1.rv.in,#h2.rv.in{filter:blur(0)}

/* ---- Bénéfices ---- */

#bens{position:absolute;left:0;right:0;top:1260px;height:230px}

.ben{
  position:absolute;top:0;width:300px;text-align:center;
  opacity:0;transform:translateY(10px);
  transition:opacity .5s linear,transform .8s var(--e);
}
.ben.in{opacity:1;transform:translateY(0)}
.ben.b1{left:77px}
.ben.b2{left:390px}
.ben.b3{left:703px}

/* Icône puis texte : le texte suit l'icône de 90 ms. */
.ben .ic{
  width:64px;height:64px;margin:0 auto 26px;
  opacity:0;transform:translateY(8px);
  transition:opacity .45s linear,transform .7s var(--e);
}
.ben .tx{
  font-size:28px;font-weight:500;line-height:1.4;letter-spacing:-.008em;color:var(--body);
  opacity:0;transform:translateY(8px);
  transition:opacity .45s linear .09s,transform .7s var(--e) .09s;
}
.ben.in .ic,.ben.in .tx{opacity:1;transform:translateY(0)}
.ben .ic svg{display:block;width:100%;height:100%}

.sep{
  position:absolute;top:12px;width:1px;height:152px;background:var(--line);
  opacity:0;transform:scaleY(.4);transform-origin:50% 50%;
  transition:opacity .45s linear,transform .65s var(--e);
}
.sep.in{opacity:1;transform:scaleY(1)}
#sep1{left:386px}
#sep2{left:700px}

/* ---- Échéance ---- */

#dot2{
  position:absolute;left:50%;top:1512px;width:16px;height:16px;margin-left:-8px;
  border-radius:50%;background:var(--blue);
  opacity:0;transform:translateY(8px) scale(.6);
  transition:opacity .4s linear,transform .7s var(--e);
}
#dot2.in{opacity:1;transform:translateY(0) scale(1)}

#until,#date{
  position:absolute;left:0;right:0;text-align:center;
  font-size:34px;font-weight:700;letter-spacing:.03em;line-height:1;
  white-space:nowrap;
}
#until{top:1554px;color:var(--ink)}
#date{top:1596px;color:var(--blue)}

@media (prefers-reduced-motion:reduce){
  .rv,.rv *,#hero *,.ben,.ben *,.sep,#dot2{transition:none !important}
}
</style>
</head>
<body>

<div class="stage" id="stage">
<div class="viewport" id="viewport">

  <!-- Logo -->
  <div id="lockup">
    <div id="mark" class="rv rv-down">
      <svg viewBox="0 0 70 96" aria-hidden="true">
        <path fill="var(--ink)" d="M6 0 H47.5 A22.5 22.5 0 0 1 47.5 45 H6 Q0 45 0 39 V6 Q0 0 6 0 Z"/>
        <path fill="var(--ink)" d="M6 52 H48 A22 22 0 0 1 48 96 H6 Q0 96 0 90 V58 Q0 52 6 52 Z"/>
      </svg>

        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="var(--blue)" d="M23 12l-2.44-2.79.34-3.69-3.61-.82-1.89-3.2L12 2.96 8.6 1.5 6.71 4.69 3.1 5.5l.34 3.7L1 12l2.44 2.79-.34 3.7 3.61.81L8.6 22.5l3.4-1.47 3.4 1.46 1.89-3.19 3.61-.82-.34-3.69L23 12zm-12.91 4.72l-3.8-3.81 1.48-1.48 2.32 2.33 5.85-5.87 1.48 1.48-7.33 7.35z"/>

  <!-- Bénéfices -->

          <rect x="5" y="8" width="38" height="26" rx="2.5"/>

        <svg viewBox="0 0 48 48" fill="none" stroke="var(--ink)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 40v-6M19 40v-10M26 40v-14M33 40v-18M40 40v-22"/>

<script>
(function(){
"use strict";

var $ = function(id){ return document.getElementById(id); };

function fit(){
  $("viewport").style.transform = "scale(" + ($("stage").clientWidth / 1080) + ")";
}
window.addEventListener("resize", fit, { passive:true });
window.addEventListener("orientationchange", fit, { passive:true });
if(window.ResizeObserver){ new ResizeObserver(fit).observe($("stage")); }

/* =========================================================
   TIMELINE — brief : 7 s max, dernière entrée à ~5.1 s,
   immobilité totale ensuite. La boucle repart à 9.2 s pour
   laisser lire l'offre.
   ========================================================= */

var TL = [
  /* 0.0 → 0.8 · le logo, puis l'offre */
  [140,  function(){ $("mark").classList.add("in"); }],
  [260,  function(){ $("brand").classList.add("in"); }],
  [640,  function(){ $("offer").classList.add("in"); }],

  /* 0.8 → 2.2 · LE MOMENT : –30, le % arrive 120 ms après (delay CSS) */
  [900,  function(){ $("hero").classList.add("in"); }],

  /* 2.2 → 3.2 · le titre, ligne par ligne */
  [2250, function(){ $("h1").classList.add("in"); }],
  [2550, function(){ $("h2").classList.add("in"); }],

  /* 3.2 → 4.5 · les bénéfices, gauche → droite */
  [3250, function(){ document.querySelectorAll(".ben")[0].classList.add("in"); }],
  [3340, function(){ $("sep1").classList.add("in"); }],
  [3400, function(){ document.querySelectorAll(".ben")[1].classList.add("in"); }],
  [3490, function(){ $("sep2").classList.add("in"); }],
  [3550, function(){ document.querySelectorAll(".ben")[2].classList.add("in"); }],

  /* 4.5 → 5.3 · l'échéance */
  [4550, function(){ $("dot2").classList.add("in"); }],
  [4760, function(){ $("until").classList.add("in"); }],
  [4940, function(){ $("date").classList.add("in"); }]
];

var LOOP_AT = 9200;
var timers = [];

function clearAll(){ timers.forEach(clearTimeout); timers = []; }

function reset(){
  clearAll();
  var vp = $("viewport");
  vp.classList.add("noanim");
  document.querySelectorAll(".in").forEach(function(el){ el.classList.remove("in"); });
  void vp.offsetWidth;
  vp.classList.remove("noanim");
}

function run(){
  reset();
  TL.forEach(function(step){
    timers.push(setTimeout(step[1], step[0]));
  });
  timers.push(setTimeout(run, LOOP_AT));
}

/* Vérification hors ligne : ?still=N fige le film à N secondes. */
function seek(seconds){
  clearAll();
  var vp = $("viewport");
  vp.classList.add("noanim");
  document.querySelectorAll(".in").forEach(function(el){ el.classList.remove("in"); });
  var ms = seconds * 1000;
  TL.forEach(function(step){ if(step[0] <= ms) step[1](); });
  void vp.offsetWidth;
}
window.__seek = seek;

document.addEventListener("visibilitychange", function(){
  if(document.hidden) clearAll();
  else if(!still) run();
});

/* Un tap relance le film. */
$("stage").addEventListener("pointerdown", function(){ if(!still) run(); });

fit();

var params = new URLSearchParams(location.search);
var still = params.has("still");

function start(){
  if(still){
    seek(Number(params.get("still")) || 0);
    document.body.dataset.ready = "1";
    return;
  }
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches){
    seek(7);
    document.body.dataset.ready = "1";
    return;
  }
  run();
  document.body.dataset.ready = "1";
}

if(document.fonts && document.fonts.ready){
  var kicked = false;
  var kick = function(){ if(!kicked){ kicked = true; start(); } };
  document.fonts.ready.then(kick, kick);
  setTimeout(kick, 600);
}else{
  start();
}

})();
</script>
