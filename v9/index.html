<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0B0B0D">
<meta name="description" content="ForBusiness V9 — On remplit votre agenda.">
<title>ForBusiness — Motion V9</title>

<style>
/* =========================================================
   FORBUSINESS — MOTION V9 · LEADS : L'AGENDA QUI SE REMPLIT
   Même film que la V8, nouveau visuel : le poster agenda.
   Le curseur réserve un créneau → la case se coche → +1 RDV.
   ~14.6 s · 9:16 · boucle propre.
   ========================================================= */

:root{
  --blue:#2457FF;
  --black:#0A0A0C;
  --g1:#8A8A92;
  --g2:#C6C6CC;

  --eo:cubic-bezier(.16,1,.3,1);
  --eio:cubic-bezier(.66,0,.14,1);
  --spring:cubic-bezier(.26,1.16,.33,1);
  --cam:cubic-bezier(.3,.65,.15,1);
  --micro:cubic-bezier(.33,.85,.3,1);
  --exit:cubic-bezier(.68,0,.86,.04);
}

*{box-sizing:border-box;margin:0;padding:0}

html,body{
  width:100%;height:100%;overflow:hidden;background:#0B0B0D;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;
}

body{
  display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;
}

.stage{
  position:relative;
  width:min(100vw,56.25vh);
  width:min(100vw,56.25dvh);
  aspect-ratio:9/16;
  overflow:hidden;
  background:#fff;
  -webkit-font-smoothing:antialiased;
}

@supports not (aspect-ratio:9/16){
  .stage{height:min(177.7778vw,100vh);height:min(177.7778vw,100dvh)}
}

.viewport{
  position:absolute;left:0;top:0;width:1080px;height:1920px;
  transform-origin:0 0;will-change:transform;
}

.camera{
  position:absolute;inset:0;
  transform-origin:540px 900px;
  transform:translate3d(0,0,0) scale(1);
  transition:transform 4800ms var(--cam);
  will-change:transform;
}

.noanim,.noanim *,.noanim *::before,.noanim *::after{
  transition:none !important;animation:none !important;
}

/* =========================================================
   RÉVÉLATIONS
   ========================================================= */

.rv{
  opacity:0;transform:translateY(26px);
  transition:opacity .55s linear,transform .9s var(--eo);
}
.rv.in{opacity:1;transform:translateY(0)}
.rv.bye{opacity:0;transform:translateY(-18px);transition:opacity .4s linear,transform .55s var(--exit)}

.w{
  display:inline-block;vertical-align:top;overflow:hidden;
  padding-bottom:.16em;margin-bottom:-.16em;
}
.w > i{
  display:block;font-style:normal;
  transform:translateY(118%);opacity:0;filter:blur(4px);
  transition:transform .9s var(--eo),opacity .4s linear,filter .5s var(--eo);
  transition-delay:calc(var(--i,0) * 70ms);
}
.tl.in > .w > i{transform:translateY(0);opacity:1;filter:blur(0)}
.tl.out > .w > i{
  transform:translateY(-112%);opacity:0;filter:blur(3px);
  transition:transform .5s var(--exit),opacity .28s linear .04s,filter .35s var(--exit);
  transition-delay:calc(var(--i,0) * 26ms);
}

/* =========================================================
   LOGO — fidèle à l'image : ForBusinessfrance.fr.
   ========================================================= */

#logo{
  position:absolute;left:70px;top:118px;
  display:flex;align-items:center;gap:22px;z-index:30;
}

.mk{width:74px;height:74px;position:relative;flex:none}
.mk::before,.mk::after{
  content:"";position:absolute;left:0;width:60px;
  background:var(--black);
}
.mk::before{top:4px;height:30px;border-radius:10px 26px 26px 4px}
.mk::after{bottom:4px;height:32px;border-radius:4px 26px 26px 10px}

#logo .lt{
  font-size:44px;font-weight:740;letter-spacing:-.035em;color:var(--black);
}
#logo .lt b{
  display:inline-block;color:var(--blue);font-weight:740;
  transform:scale(0);transform-origin:50% 74%;
}
#logo .lt b.pop{transform:scale(1);transition:transform .55s var(--spring)}
@keyframes breathe9{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
#logo .lt b.life{animation:breathe9 2.4s ease-in-out .2s infinite}

/* =========================================================
   HEADLINE — centrée comme le poster
   ========================================================= */

#hl{position:absolute;left:0;right:0;top:340px;z-index:30;text-align:center}
#hl1{font-size:100px;line-height:1.08;font-weight:770;letter-spacing:-.035em;color:var(--black);white-space:nowrap}
#hl2{font-size:100px;line-height:1.08;font-weight:770;letter-spacing:-.035em;color:var(--blue);white-space:nowrap}
#hl2 .bk{color:var(--black)}

/* le retournement : « Plus de leads. Plus de rendez-vous. Plus de clients. » */
#hlB{position:absolute;left:0;right:0;top:264px;z-index:30;text-align:center}
#hlB1,#hlB2,#hlB3{font-size:92px;line-height:1.06;font-weight:770;letter-spacing:-.036em;white-space:nowrap}
#hlB1,#hlB2{color:var(--black)}
#hlB1 .bd,#hlB2 .bd{color:var(--blue)}
#hlB3{color:var(--blue)}
#hlB3 .bk{color:var(--black)}

/* =========================================================
   LA SCÈNE — le poster agenda, recréé fidèlement
   ========================================================= */

#sc{
  position:absolute;left:0;top:560px;width:1080px;height:1180px;
  z-index:20;
  opacity:0;
  transform:translateY(52px) scale(.945);
  transition:opacity .7s linear,transform 1.15s var(--eo);
  will-change:transform,opacity;
}
#sc.in{opacity:1;transform:translateY(0) scale(1)}
#sc.back{
  opacity:.30;
  transform:translateY(38px) scale(.955);
  transition:opacity .9s var(--eio),transform 1.1s var(--eio);
}
#sc.bye{opacity:0;transform:translateY(26px) scale(.94);
  transition:opacity .5s linear,transform .7s var(--exit)}

/* légère inclinaison du poster + respiration d'ensemble */
@keyframes t9drift{
  0%,100%{transform:rotate(-6deg) translateY(0)}
  50%{transform:rotate(-6deg) translateY(-7px)}
}
#tilt{
  position:absolute;inset:0;
  transform:rotate(-6deg);
  transform-origin:540px 560px;
  animation:t9drift 7s ease-in-out infinite;
}

/* carte blanche derrière */
#back{
  position:absolute;left:205px;top:55px;width:670px;height:940px;
  border-radius:64px;
  background:linear-gradient(170deg,#FFFFFF 0%,#F1F3F9 100%);
  box-shadow:0 50px 120px rgba(10,10,40,.18);
}

/* carte bleue — dégradé profond, lumière en haut */
#bluec{
  position:absolute;left:240px;top:90px;width:600px;height:870px;
  border-radius:48px;
  background:linear-gradient(160deg,#4070FF 0%,#2457FF 46%,#1B44D6 100%);
  box-shadow:0 36px 90px rgba(36,87,255,.36),inset 0 2px 0 rgba(255,255,255,.28);
}

/* spirales chromées : anneaux qui plongent dans leurs encoches */
#rings{position:absolute;left:0;top:56px;width:600px;height:220px;z-index:6}
#rings svg{display:block;width:100%;height:100%;overflow:visible}

/* le calendrier */
#cal{
  position:absolute;left:60px;top:150px;width:480px;height:560px;
  border-radius:34px;
  background:linear-gradient(180deg,#FFFFFF 62%,#F4F6FA 100%);
  box-shadow:0 32px 70px rgba(9,14,50,.38);
}
@keyframes calk{
  0%,100%{transform:translateY(0)}
  35%{transform:translateY(-9px)}
  70%{transform:translateY(2px)}
}
#cal.kick{animation:calk .55s var(--micro) 1}

#chead{
  position:absolute;left:0;top:0;width:480px;height:128px;
  border-radius:34px 34px 0 0;
  background:linear-gradient(180deg,#3D6BFF 0%,#2457FF 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.30);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:42px;font-weight:800;letter-spacing:.1em;
  text-shadow:0 2px 4px rgba(10,20,90,.25);
}

/* grille des jours — touches de clavier, relief doux */
.day{
  position:absolute;width:84px;height:84px;border-radius:20px;
  background:linear-gradient(180deg,#FBFCFE 0%,#ECEEF4 100%);
  box-shadow:0 7px 16px rgba(15,20,50,.12),inset 0 1px 0 #FFFFFF;
}

/* la case réservée — même cascade d'entrée que les autres,
   seuls le fond et l'ombre réagissent sans délai au clic */
#dchk{
  transition:opacity .4s linear,transform .7s var(--eo),background .3s linear,box-shadow .3s linear;
  transition-delay:calc(.55s + var(--i,0) * 45ms),calc(.55s + var(--i,0) * 45ms),0s,0s;
}
#dchk svg{display:block;width:100%;height:100%}
#dchk svg polyline{
  fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:1;stroke-dashoffset:1;
}
@keyframes chkpop{
  0%{transform:scale(1)}
  40%{transform:scale(1.14)}
  100%{transform:scale(1)}
}
#dchk.hov{background:linear-gradient(180deg,#EEF2FC 0%,#DEE4F4 100%)}
#dchk.on{
  background:linear-gradient(180deg,#3D6BFF 0%,#1E4AE8 100%);
  box-shadow:0 14px 30px rgba(36,87,255,.5),inset 0 1px 0 rgba(255,255,255,.4);
  animation:chkpop .5s var(--spring) 1;
}
#dchk.on svg polyline{
  stroke-dashoffset:0;
  transition:stroke-dashoffset .3s var(--micro) .08s;
}

/* le badge +1 RDV */
#rdv{
  position:absolute;left:170px;top:728px;width:260px;height:88px;border-radius:28px;
  background:linear-gradient(180deg,#FFFFFF 0%,#F3F5FA 100%);
  box-shadow:0 22px 48px rgba(9,14,50,.34),inset 0 1px 0 #FFFFFF;
  display:flex;align-items:center;justify-content:center;
  color:var(--blue);font-size:40px;font-weight:800;letter-spacing:.02em;
  opacity:0;transform:scale(.5);
}
@keyframes rdvin{
  0%{transform:scale(.5);opacity:0}
  55%{transform:scale(1.1);opacity:1}
  100%{transform:scale(1);opacity:1}
}
#rdv.in{opacity:1;transform:scale(1);animation:rdvin .55s cubic-bezier(.3,.7,.3,1) 1}
@keyframes rdvpulse{
  0%,100%{transform:scale(1)}
  40%{transform:scale(1.07)}
}
#rdv.pulse{animation:rdvpulse .6s var(--micro) 1}

/* éléments : mise en place décalée */
.el{
  opacity:0;transform:translateY(20px);
  transition:opacity .5s linear,transform .8s var(--eo);
  transition-delay:calc(var(--i,0) * 60ms);
}
#sc.in .el{opacity:1;transform:translateY(0)}

/* les jours arrivent en cascade */
#sc.in .day{
  opacity:1;transform:translateY(0) scale(1);
}
.day{
  opacity:0;transform:translateY(14px) scale(.9);
  transition:opacity .4s linear,transform .7s var(--eo);
  transition-delay:calc(.55s + var(--i,0) * 45ms);
}

/* =========================================================
   CURSEUR DISCRET
   ========================================================= */

#cur{
  position:absolute;left:0;top:0;z-index:60;opacity:0;
  transform:translate3d(1120px,1500px,0);
  transition:transform .8s var(--micro),opacity .4s linear;
  will-change:transform;
}
#cur.on{opacity:.92}
#cur svg{width:32px;height:32px;display:block;filter:drop-shadow(0 3px 8px rgba(0,0,0,.25))}

/* =========================================================
   FIN — ForBusiness.
   ========================================================= */

#fin{position:absolute;inset:0;z-index:40;pointer-events:none}

#fb{
  position:absolute;left:0;right:0;top:772px;
  display:flex;align-items:center;justify-content:center;gap:26px;
}
#fb .mk{width:96px;height:96px}
#fb .mk::before,#fb .mk::after{width:78px}
#fb .mk::before{top:5px;height:39px;border-radius:13px 34px 34px 5px}
#fb .mk::after{bottom:5px;height:41px;border-radius:5px 34px 34px 13px}
#fb .fbt{font-size:92px;font-weight:760;letter-spacing:-.04em;color:var(--black)}
#fb .fbt b{
  display:inline-block;position:relative;
  color:var(--blue);font-weight:760;
  transform:scale(0);
  transform-origin:50% 74%;
}

@keyframes dotin{
  0%{transform:translateY(-120px) scale(.5);opacity:0}
  30%{opacity:1}
  55%{transform:translateY(0) scale(1.3)}
  72%{transform:translateY(0) scale(.9)}
  100%{transform:translateY(0) scale(1)}
}
#fb .fbt b.pop{animation:dotin .75s cubic-bezier(.3,.7,.3,1) forwards}

@keyframes beat{
  0%,100%{transform:scale(1)}
  18%{transform:scale(1.42)}
  40%{transform:scale(1)}
}
#fb .fbt b.beat{animation:beat 1.15s cubic-bezier(.3,.6,.3,1) infinite}

#fb .fbt b.beat::after{
  content:"";position:absolute;left:50%;top:74%;
  width:34px;height:34px;margin:-17px 0 0 -17px;
  border:4px solid var(--blue);border-radius:50%;
  opacity:0;
  animation:ping 1.15s cubic-bezier(.2,.55,.35,1) infinite;
}
@keyframes ping{
  0%{transform:scale(.45);opacity:.75}
  75%,100%{transform:scale(2.6);opacity:0}
}

#tg9{
  position:absolute;left:0;right:0;top:942px;text-align:center;
  font-size:33px;font-weight:540;letter-spacing:-.02em;color:var(--g1);
}

#cta9{
  position:absolute;left:250px;top:1064px;width:580px;height:104px;border-radius:999px;
  background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;gap:16px;
  font-size:33px;font-weight:700;letter-spacing:-.02em;
}
#cta9 .arr{display:inline-block;transition:transform .5s var(--spring)}
#cta9.go .arr{transform:translateX(9px)}
#cta9.rv.in{box-shadow:0 20px 50px rgba(36,87,255,.26)}

</style>
</head>

<body>

<div class="stage" id="stage">
<div class="viewport" id="viewport">
<div class="camera" id="camera">

  <!-- LOGO -->
  <div id="logo" class="rv">
    <div class="mk"></div>
    <div class="lt">ForBusinessfrance.fr<b id="ldot">.</b></div>
  </div>

  <!-- HEADLINE (le poster) -->
  <div id="hl">
    <div class="tl" id="hl1"
      ><span class="w" style="--i:0"><i>On</i></span>
      <span class="w" style="--i:1"><i>remplit</i></span></div>
    <div class="tl" id="hl2"
      ><span class="w" style="--i:1"><i>votre</i></span>
      <span class="w" style="--i:2"><i>agenda<span class="bk">.</span></i></span></div>
  </div>

  <!-- MESSAGE : le retournement leads -->
  <div id="hlB">
    <div class="tl" id="hlB1"
      ><span class="w" style="--i:0"><i>Plus</i></span>
      <span class="w" style="--i:1"><i>de</i></span>
      <span class="w" style="--i:2"><i>leads<span class="bd">.</span></i></span></div>
    <div class="tl" id="hlB2"
      ><span class="w" style="--i:1"><i>Plus</i></span>
      <span class="w" style="--i:2"><i>de</i></span>
      <span class="w" style="--i:3"><i>rendez-vous<span class="bd">.</span></i></span></div>
    <div class="tl" id="hlB3"
      ><span class="w" style="--i:2"><i>Plus</i></span>
      <span class="w" style="--i:3"><i>de</i></span>
      <span class="w" style="--i:4"><i>clients<span class="bk">.</span></i></span></div>
  </div>

  <!-- LA SCÈNE : le poster agenda -->
  <div id="sc">
    <div id="tilt">

      <div id="back" class="el" style="--i:0"></div>

      <div id="bluec" class="el" style="--i:2">

        <div id="rings">
          <svg viewBox="0 0 600 220" aria-hidden="true">
            <defs>
              <linearGradient id="chrome9" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0"   stop-color="#8E95A5"/>
                <stop offset=".28" stop-color="#E9ECF2"/>
                <stop offset=".5"  stop-color="#FFFFFF"/>
                <stop offset=".74" stop-color="#B2B8C6"/>
                <stop offset="1"   stop-color="#7C8293"/>
              </linearGradient>
              <filter id="rsh9" x="-60%" y="-60%" width="220%" height="220%">
                <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0A0F35" flood-opacity=".3"/>
              </filter>
            </defs>
            <!-- encoches -->
            <rect x="128" y="112" width="46" height="16" rx="8" fill="rgba(6,11,45,.34)"/>
            <rect x="252" y="112" width="46" height="16" rx="8" fill="rgba(6,11,45,.34)"/>
            <rect x="310" y="112" width="46" height="16" rx="8" fill="rgba(6,11,45,.34)"/>
            <rect x="434" y="112" width="46" height="16" rx="8" fill="rgba(6,11,45,.34)"/>
            <!-- anneaux chromés, plongeant dans les encoches -->
            <g filter="url(#rsh9)" fill="none" stroke="url(#chrome9)" stroke-width="13">
              <rect x="132" y="46" width="38" height="76" rx="19"/>
              <rect x="256" y="46" width="38" height="76" rx="19"/>
              <rect x="314" y="46" width="38" height="76" rx="19"/>
              <rect x="438" y="46" width="38" height="76" rx="19"/>
            </g>
          </svg>
        </div>

        <div id="cal">
          <div id="chead">AGENDA</div>

          <div class="day" style="--i:0;left:36px;top:162px"></div>
          <div class="day" style="--i:1;left:144px;top:162px"></div>
          <div class="day" style="--i:2;left:252px;top:162px"></div>
          <div class="day" style="--i:3;left:360px;top:162px"></div>
          <div class="day" style="--i:4;left:36px;top:270px"></div>
          <div class="day" style="--i:5;left:144px;top:270px"></div>
          <div class="day" style="--i:6;left:252px;top:270px"></div>
          <div class="day" style="--i:7;left:360px;top:270px"></div>
          <div class="day" style="--i:8;left:36px;top:378px"></div>
          <div class="day" style="--i:9;left:144px;top:378px"></div>
          <div class="day" id="dchk" style="--i:10;left:252px;top:378px">
            <svg viewBox="0 0 84 84" aria-hidden="true">
              <polyline pathLength="1" points="24,44 38,58 61,30"/>
            </svg>

          <div class="day" style="--i:11;left:360px;top:378px"></div>
        </div>

        <div id="rdv">+1 RDV</div>

      </div>

    </div>
  </div>

  <!-- CURSEUR -->
  <div id="cur">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M5 2 L5 20 L9.5 16 L12.5 22.5 L15.6 21 L12.6 14.6 L19 14.6 Z"
            fill="#0A0A0C" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/>
    </svg>
  </div>

  <!-- FIN -->
  <div id="fin">
    <div id="fb" class="rv">
      <div class="mk"></div>
      <div class="fbt">ForBusiness<b id="fdot9">.</b></div>
    </div>
    <div id="tg9" class="rv">Votre entreprise mérite mieux qu'un site ordinaire.</div>
    <div id="cta9" class="rv">ForBusinessFrance.fr<span class="arr">→</span></div>
  </div>

</div>
</div>

<script>
(function(){
"use strict";

var $ = function(id){ return document.getElementById(id); };

function fit(){
  $("viewport").style.transform = "scale(" + ($("stage").clientWidth / 1080) + ")";
}
window.addEventListener("resize", fit, { passive:true });
window.addEventListener("orientationchange", fit, { passive:true });
if(window.ResizeObserver){ new ResizeObserver(fit).observe($("stage")); }

var timers = [];
function at(t, fn){ timers.push(setTimeout(fn, t)); }
function clearAll(){ timers.forEach(clearTimeout); timers = []; }

function cam(scale, y, dur){
  var c = $("camera");
  c.style.transitionDuration = (dur || 4800) + "ms";
  c.style.transform = "translate3d(0," + y + "px,0) scale(" + scale + ")";
}

function curTo(x, y, dur, ease){
  var c = $("cur");
  c.style.transitionDuration = (dur || 800) + "ms,400ms";
  c.style.transitionTimingFunction = (ease || "cubic-bezier(.33,.85,.3,1)") + ",linear";
  c.style.transform = "translate3d(" + x + "px," + y + "px,0)";
}

function reset(){
  clearAll();
  var vp = $("viewport");
  vp.classList.add("noanim");

  $("logo").className = "rv";
  $("hl1").className = "tl";
  $("hl2").className = "tl";
  $("hlB1").className = "tl";
  $("hlB2").className = "tl";
  $("hlB3").className = "tl";
  $("sc").className = "";
  $("cal").className = "";
  $("dchk").className = "day";
  $("rdv").className = "";

  $("fb").className = "rv";
  $("fdot9").className = "";
  $("ldot").className = "";
  $("tg9").className = "rv";
  $("cta9").className = "rv";

  var c = $("cur");
  c.className = "";
  c.style.transitionDuration = "0ms";
  c.style.transform = "translate3d(1120px,1500px,0)";

  $("camera").style.transitionDuration = "";
  $("camera").style.transform = "translate3d(0,0,0) scale(1)";

  void vp.offsetWidth;
  vp.classList.remove("noanim");
}

/* =========================================================
   TIMELINE — ~14.6 s
   0–2.5 : le poster se met en place · 2.8–5.7 : le curseur
   réserve un créneau (+1 RDV) · 5.9–9 : le retournement ·
   9.9–13.9 : ForBusiness · boucle
   ========================================================= */
function run(){

  reset();

  /* ---- 0–2.5 s · mise en place ---- */

  at(180, function(){ $("logo").classList.add("in"); });
  at(850, function(){ $("ldot").classList.add("pop"); });
  at(1700, function(){ $("ldot").classList.add("life"); });
  at(430, function(){ $("hl1").classList.add("in"); });
  at(640, function(){ $("hl2").classList.add("in"); });

  at(750, function(){
    $("sc").classList.add("in");
    cam(1.035, -26, 5200);
  });

  if(document.hidden) clearAll();

});

function start(force){
  if(started && !force) return;
  started = true;
  run();
}
